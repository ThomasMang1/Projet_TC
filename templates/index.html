<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irrigo - Robot d'Arrosage Intelligent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.0.7/css/boxicons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .status-card {
            background: linear-gradient(135deg, #00b4db, #0083B0);
            color: white;
        }
        .chart-container {
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class='bx bx-water'></i> Irrigo
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="#"><i class='bx bx-home'></i> Tableau de bord</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-4">
                <div class="card status-card">
                    <div class="card-body">
                        <h5 class="card-title"><i class='bx bx-robot'></i> État du Robot</h5>
                        <div id="robot-status">
                            <p>Batterie: <span id="battery-level">--</span>%</p>
                            <p>Niveau d'eau: <span id="water-level">--</span>%</p>
                            <div class="mt-3">
                                <button class="btn btn-success me-2" onclick="sendStartCommand()">
                                    <i class='bx bx-play'></i> Start
                                </button>
                                <button class="btn btn-danger" onclick="sendStopCommand()">
                                    <i class='bx bx-stop'></i> Stop
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title"><i class='bx bx-water'></i> Consommation d'eau</h5>
                        <canvas id="graphiqueConsommation"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title"><i class='bx bx-sun'></i> Météo</h5>
                        <div id="weather-info">
                            <p>Température: <span id="temperature">--</span>°C</p>
                            <p>Prévisions: <span id="forecast">--</span></p>
                            <p>Humidité: <span id="humidity">--</span></p>
                            <p>Vitesse du vent: <span id="wind">--</span></p>

                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title"><i class='bx bx-leaf'></i> Plantes</h5>
                            <div>
                                <button class="btn btn-success me-2" onclick="exportPlantes()">
                                    <i class='bx bx-export'></i> Exporter
                                </button>
                                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPlantModal">
                                    <i class='bx bx-plus'></i> Ajouter une plante
                                </button>
                            </div>
                        </div>
                        <div id="plants-list"></div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title"><i class='bx bx-map'></i> Zones</h5>
                            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addZoneModal">
                                <i class='bx bx-plus'></i> Ajouter une zone
                            </button>
                        </div>
                        <div id="zones-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addPlantModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Ajouter une nouvelle plante</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addPlantForm">
                        <div class="mb-3">
                            <label for="plantSelect" class="form-label">Nom de la plante (Catalogue)</label>
                            <select id="plantSelect" class="form-select" onchange="showPlantInfo()">
                                <option value="" selected disabled>Choisir une plante...</option>
                            </select>
                        </div>

                        <div id="plantInfo" style="display: none;">
                            <div class="mb-3">
                                <label for="humidityMin" class="form-label">Humidité minimale (%)</label>
                                <input type="number" class="form-control" id="humidityMin" readonly>
                            </div>
                            <div class="mb-3">
                                <label for="humidityMax" class="form-label">Humidité maximale (%)</label>
                                <input type="number" class="form-control" id="humidityMax" readonly>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="plantDescription" class="form-label">Description (Optionnel)</label>
                            <textarea class="form-control" id="plantDescription"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="plantZone" class="form-label">Zone</label>
                            <select class="form-control" id="plantZone">
                                <option value="">Sélectionner une zone</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-primary" onclick="addPlant()">Ajouter</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editPlantModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Modifier la plante</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editPlantForm">
                        <input type="hidden" id="editPlantId">
                        <div class="mb-3">
                            <label for="editPlantName" class="form-label">Nom de la plante</label>
                            <input type="text" class="form-control" id="editPlantName" required>
                        </div>
                        <div class="mb-3">
                            <label for="editHumidityMin" class="form-label">Humidité minimale (%)</label>
                            <input type="number" class="form-control" id="editHumidityMin" required>
                        </div>
                        <div class="mb-3">
                            <label for="editHumidityMax" class="form-label">Humidité maximale (%)</label>
                            <input type="number" class="form-control" id="editHumidityMax" required>
                        </div>
                        <div class="mb-3">
                            <label for="editPlantDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="editPlantDescription"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="editPlantZone" class="form-label">Zone</label>
                            <select class="form-control" id="editPlantZone">
                                <option value="">Sélectionner une zone</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-primary" onclick="updatePlant()">Mettre à jour</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addZoneModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Ajouter une nouvelle zone</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addZoneForm">
                        <div class="mb-3">
                            <label for="zoneName" class="form-label">Nom de la zone</label>
                            <input type="text" class="form-control" id="zoneName" required>
                        </div>
                        <div class="mb-3">
                            <label for="zoneDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="zoneDescription"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-primary" onclick="addZone()">Ajouter</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editZoneModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Modifier la zone</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editZoneForm">
                        <input type="hidden" id="editZoneId">
                        <div class="mb-3">
                            <label for="editZoneName" class="form-label">Nom de la zone</label>
                            <input type="text" class="form-control" id="editZoneName" required>
                        </div>
                        <div class="mb-3">
                            <label for="editZoneDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="editZoneDescription"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-primary" onclick="updateZone()">Mettre à jour</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Variable globale pour stocker les plantes du catalogue
        let cataloguePlantesData = [];

        // Fonction pour mettre à jour l'état du robot
        function updateRobotStatus() {
            fetch('/api/robot/status')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('battery-level').textContent = data.batterie;
                    document.getElementById('water-level').textContent = data.eau;
                    document.getElementById('robot-state').textContent = data.etat;
                });
        }

        // Fonction pour mettre à jour la liste des plantes de l'utilisateur
        function updatePlantsList() {
            fetch('/api/plantes')
                .then(response => response.json())
                .then(plantes => {
                    const plantsList = document.getElementById('plants-list');
                    plantsList.innerHTML = plantes.map(plante => `
                        <div class="plant-item mb-3 p-3 border rounded">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h6>${plante.nom}</h6>
                                    <p class="mb-1">Zone: ${plante.zone || 'Non assignée'}</p>
                                    <p class="mb-0">Humidité: ${plante.humidite_min}% - ${plante.humidite_max}%</p>
                                </div>
                                <div>
                                    <button class="btn btn-sm btn-outline-primary me-2" onclick="editPlant(${plante.id})">
                                        <i class='bx bx-edit'></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="deletePlant(${plante.id})">
                                        <i class='bx bx-trash'></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `).join('');
                });
        }

        // Fonction pour mettre à jour la liste des zones
        function updateZonesList() {
            fetch('/api/zones')
                .then(response => response.json())
                .then(zones => {
                    const zonesList = document.getElementById('zones-list');
                    zonesList.innerHTML = zones.map(zone => `
                        <div class="zone-item mb-3 p-3 border rounded">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h6>${zone.nom}</h6>
                                    <p class="mb-1">Description: ${zone.description || 'N/A'}</p>
                                    <p class="mb-0">Nombre de plantes: ${zone.nombre_plantes || 0}</p>
                                </div>
                                <div>
                                    <button class="btn btn-sm btn-outline-primary me-2" onclick="editZone(${zone.id})">
                                        <i class='bx bx-edit'></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteZone(${zone.id})">
                                        <i class='bx bx-trash'></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `).join('');
                });
        }

        // Fonction pour charger les zones dans le select d'ajout de plante
        function loadZones() {
            fetch('/api/zones')
                .then(response => response.json())
                .then(zones => {
                    const select = document.getElementById('plantZone');
                    select.innerHTML = '<option value="">Sélectionner une zone</option>'; // Réinitialiser pour éviter les doublons
                    zones.forEach(zone => {
                        const option = document.createElement('option');
                        option.value = zone.id;
                        option.textContent = zone.nom;
                        select.appendChild(option);
                    });
                });
        }

        // Fonction pour charger les zones dans le select de modification de plante
        function loadZonesForEditPlant() {
            fetch('/api/zones')
                .then(response => response.json())
                .then(zones => {
                    const select = document.getElementById('editPlantZone');
                    select.innerHTML = '<option value="">Sélectionner une zone</option>'; // Réinitialiser
                    zones.forEach(zone => {
                        const option = document.createElement('option');
                        option.value = zone.id;
                        option.textContent = zone.nom;
                        select.appendChild(option);
                    });
                });
        }

        // Fonction pour récupérer les données météo et les afficher
        async function fetchWeather() {
            try {
                const response = await fetch('/api/meteo?lat=43.6045&lon=1.4442');  // Toulouse par défaut
                const data = await response.json(); 

                if (response.ok) {
                    document.getElementById('temperature').textContent = data.temperature_C;
                    document.getElementById('forecast').textContent = data.description;
                    document.getElementById('humidity').textContent = data.humidity + '%'; 
                    document.getElementById('wind').textContent = data.wind_speed + ' m/s';
                } else {
                    console.error('Erreur API:', data.error);
                    document.getElementById('weather-info').innerHTML = '<p>Erreur lors de la récupération de la météo</p>';
                }
            } catch (error) {
                console.error('Erreur fetch:', error);
                document.getElementById('weather-info').innerHTML = '<p>Erreur de chargement des données météo</p>';
            }
        }

        // Fonction pour ajouter une plante
        function addPlant() {
            const formData = {
                nom: document.getElementById('plantSelect').value, // Utilise le nom du catalogue
                humidite_min: parseFloat(document.getElementById('humidityMin').value),
                humidite_max: parseFloat(document.getElementById('humidityMax').value),
                description: document.getElementById('plantDescription').value,
                zone_id: document.getElementById('plantZone').value || null
            };

            fetch('/api/plantes', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert('Erreur: ' + data.error);
                } else {
                    alert('Plante ajoutée avec succès!');
                    // Fermer le modal
                    const modal = bootstrap.Modal.getInstance(document.getElementById('addPlantModal'));
                    modal.hide();
                    // Mettre à jour la liste des plantes de l'utilisateur
                    updatePlantsList();
                    document.getElementById('addPlantForm').reset(); // Réinitialiser le formulaire
                    document.getElementById('plantInfo').style.display = 'none'; // Cacher les infos auto-remplies
                }
            })
            .catch(error => {
                alert('Erreur lors de l\'ajout de la plante: ' + error);
            });
        }

        // Fonction pour supprimer une plante
        function deletePlant(planteId) {
            if (confirm('Êtes-vous sûr de vouloir supprimer cette plante ?')) {
                fetch(`/api/plantes/${planteId}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        alert('Erreur: ' + data.error);
                    } else {
                        alert('Plante supprimée avec succès!');
                        updatePlantsList();
                    }
                })
                .catch(error => {
                    alert('Erreur lors de la suppression de la plante: ' + error);
                });
            }
        }

        // Fonction pour ouvrir le modal de modification d'une plante
        function editPlant(planteId) {
            fetch(`/api/plantes/${planteId}`)
                .then(response => response.json())
                .then(plante => {
                    document.getElementById('editPlantId').value = plante.id;
                    document.getElementById('editPlantName').value = plante.nom;
                    document.getElementById('editHumidityMin').value = plante.humidite_min;
                    document.getElementById('editHumidityMax').value = plante.humidite_max;
                    document.getElementById('editPlantDescription').value = plante.description || '';
                    
                    // Assurez-vous que les zones sont chargées avant de sélectionner la zone
                    loadZonesForEditPlant().then(() => { // Charger les zones de manière asynchrone
                        document.getElementById('editPlantZone').value = plante.zone_id || '';
                        const modal = new bootstrap.Modal(document.getElementById('editPlantModal'));
                        modal.show();
                    });
                });
        }

        // Fonction pour mettre à jour une plante
        function updatePlant() {
            const planteId = document.getElementById('editPlantId').value;
            const formData = {
                nom: document.getElementById('editPlantName').value,
                humidite_min: parseFloat(document.getElementById('editHumidityMin').value),
                humidite_max: parseFloat(document.getElementById('editHumidityMax').value),
                description: document.getElementById('editPlantDescription').value,
                zone_id: document.getElementById('editPlantZone').value || null
            };

            fetch(`/api/plantes/${planteId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert('Erreur: ' + data.error);
                } else {
                    alert('Plante mise à jour avec succès!');
                    const modal = bootstrap.Modal.getInstance(document.getElementById('editPlantModal'));
                    modal.hide();
                    updatePlantsList();
                }
            })
            .catch(error => {
                alert('Erreur lors de la mise à jour de la plante: ' + error);
            });
        }

        // Fonction pour ajouter une zone
        function addZone() {
            const formData = {
                nom: document.getElementById('zoneName').value,
                description: document.getElementById('zoneDescription').value
            };

            fetch('/api/zones', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert('Erreur: ' + data.error);
                } else {
                    alert('Zone ajoutée avec succès!');
                    const modal = bootstrap.Modal.getInstance(document.getElementById('addZoneModal'));
                    modal.hide();
                    updateZonesList();
                    loadZones(); // Recharger les zones dans les selects d'ajout de plante
                    loadZonesForEditPlant(); // Recharger les zones dans les selects de modification de plante
                }
            })
            .catch(error => {
                alert('Erreur lors de l\'ajout de la zone: ' + error);
            });
        }

        // Fonction pour ouvrir le modal de modification de zone
        function editZone(zoneId) {
            fetch(`/api/zones/${zoneId}`)
                .then(response => response.json())
                .then(zone => {
                    document.getElementById('editZoneId').value = zone.id;
                    document.getElementById('editZoneName').value = zone.nom;
                    document.getElementById('editZoneDescription').value = zone.description || '';
                    
                    const modal = new bootstrap.Modal(document.getElementById('editZoneModal'));
                    modal.show();
                });
        }

        // Fonction pour mettre à jour une zone
        function updateZone() {
            const zoneId = document.getElementById('editZoneId').value;
            const formData = {
                nom: document.getElementById('editZoneName').value,
                description: document.getElementById('editZoneDescription').value
            };

            fetch(`/api/zones/${zoneId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert('Erreur: ' + data.error);
                } else {
                    alert('Zone mise à jour avec succès!');
                    const modal = bootstrap.Modal.getInstance(document.getElementById('editZoneModal'));
                    modal.hide();
                    updateZonesList();
                    loadZones(); // Recharger les zones dans les selects
                    loadZonesForEditPlant(); // Recharger les zones dans les selects de modification de plante
                }
            })
            .catch(error => {
                alert('Erreur lors de la mise à jour de la zone: ' + error);
            });
        }

        // Fonction pour supprimer une zone
        function deleteZone(zoneId) {
            if (confirm('Êtes-vous sûr de vouloir supprimer cette zone ?')) {
                fetch(`/api/zones/${zoneId}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        alert('Erreur: ' + data.error);
                    } else {
                        alert('Zone supprimée avec succès!');
                        updateZonesList();
                        loadZones(); // Recharger les zones dans les selects
                        loadZonesForEditPlant(); // Recharger les zones dans les selects de modification de plante
                    }
                })
                .catch(error => {
                    alert('Erreur lors de la suppression de la zone: ' + error);
                });
            }
        }

        // Fonction pour exporter les plantes
        function exportPlantes() {
            window.location.href = '/api/plantes/export';
        }

        // Fonctions pour les commandes start/stop
        function sendStartCommand() {
            fetch('/api/robot/command', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ command: 'start' })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert('Erreur: ' + data.error);
                } else {
                    alert('Commande start envoyée avec succès!');
                }
            })
            .catch(error => {
                alert('Erreur lors de l\'envoi de la commande: ' + error);
            });
        }

        function sendStopCommand() {
            fetch('/api/robot/command', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ command: 'stop' })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert('Erreur: ' + data.error);
                } else {
                    alert('Commande stop envoyée avec succès!');
                }
            })
            .catch(error => {
                alert('Erreur lors de l\'envoi de la commande: ' + error);
            });
        }

        // ✅ Fonction pour charger les plantes du catalogue dans le dropdown (menu déroulant)
        function loadCataloguePlantsDropdown() {
            fetch('/api/plantes/dropdown')
                .then(response => response.json())
                .then(data => {
                    cataloguePlantesData = data; // Stocker les plantes du catalogue
                    const plantSelect = document.getElementById('plantSelect');
                    plantSelect.innerHTML = '<option value="" selected disabled>Choisir une plante...</option>'; // Réinitialiser
                    
                    data.forEach(plant => {
                        const option = document.createElement('option');
                        option.value = plant.nom; // Utiliser le nom du catalogue comme valeur
                        option.textContent = plant.nom;
                        plantSelect.appendChild(option);
                    });
                })
                .catch(error => console.error("Erreur lors du chargement des plantes du catalogue :", error));
        }

        // ✅ Fonction pour afficher les informations de la plante sélectionnée depuis le catalogue
        function showPlantInfo() {
            const selectedPlantName = document.getElementById('plantSelect').value;
            const plantInfo = cataloguePlantesData.find(p => p.nom === selectedPlantName);

            if (plantInfo) {
                document.getElementById('plantInfo').style.display = 'block';
                document.getElementById('humidityMin').value = plantInfo.humidite_min ?? '';
                document.getElementById('humidityMax').value = plantInfo.humidite_max ?? '';
            } else {
                document.getElementById('plantInfo').style.display = 'none';
                document.getElementById('humidityMin').value = '';
                document.getElementById('humidityMax').value = '';
            }
        }

        // Écoute l'ouverture de la modale d'ajout de plante pour charger le catalogue
        const addPlantModal = document.getElementById('addPlantModal');
        addPlantModal.addEventListener('show.bs.modal', function () {
            loadCataloguePlantsDropdown(); // Recharge les options du catalogue
            document.getElementById('plantInfo').style.display = 'none'; // Cacher les infos au début
            document.getElementById('addPlantForm').reset(); // Réinitialiser le formulaire
        });

        // Mise à jour périodique des données
        setInterval(updateRobotStatus, 30000);
        setInterval(updatePlantsList, 60000);
        setInterval(updateZonesList, 60000);

        // Chargement initial des données
        document.addEventListener('DOMContentLoaded', () => {
            updateRobotStatus();
            updatePlantsList();
            updateZonesList();
            loadZones(); // Charger les zones pour le modal d'ajout de plante
            loadZonesForEditPlant(); // Charger les zones pour le modal de modification de plante
            fetchWeather();
        });
    </script>
    <script src="{{ url_for('static', filename='js/consommation-eau.js') }}"></script>
</body>
</html>
